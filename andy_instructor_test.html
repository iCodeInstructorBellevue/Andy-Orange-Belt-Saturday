            function searchResultClick(itemIn) {
                let newCartEntry = document.createElement("div")

                theList.appendChild(newCartEntry)
            }

            function searchFunc(eventIn) {
                let searchbar = document.getElementById("searchbar")

                let subList = itemList.filter(elem => {
                    return elem.name.toLowerCase().includes(searchbar.value.toLowerCase())
                })
                if (searchbar.value.length == 0) {
                    subList = []
                }

                let searchResults = document.getElementById("search-results")
                searchResults.replaceChildren()


                for (let item of subList) {
                    let newSearchResultButton = document.createElement("div")
                    newSearchResultButton.className = "search-res-button"
 
                    newSearchResultButton.innerText = item.name
                     newSearchResultButton.addEventListener("click", function () {
                        searchResultClick(item)
                     })

                    searchResults.appendChild(newSearchResultButton)
                }
