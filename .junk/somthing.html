<!DOCTYPE html>
<html>
<head>
<title>dark shop</title>
</head>
<style>
#side {
  display: flex;
  flex-direction: row;
  justify-content: end;
}
#cart {
  background-color: black;
  width: 20vw;
  height: 100vh;
  padding: 20px;
  position: absolute;
  top: 0;
}
</style> 
<script>
  // 1. Our "Database"
const products = [
  { name: 'Key Croc', category: 'hacking device', price: '$220.00' },
  { name: 'ICopy-X Basic', category: 'hacking device', price: '$430.00' },
  { name: 'MagSpoof v5', category: 'hacking device', price: '$100.00' },
  { name: 'hackyip', category: 'hacking device', price: '$70.00' },
  { name: 'Flipper Zero', category: 'hacking device', price: '$500.00' }
];

function executeSearch() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const container = document.getElementById('resultsContainer');
  
  // 2. Filter the data
  const filtered = products.filter(item => 
    item.name.toLowerCase().includes(query) || 
    item.category.toLowerCase().includes(query)
  );

  // 3. Render the results
  renderResults(filtered);
}

function renderResults(data) {
  const container = document.getElementById('resultsContainer');
  
  // Clear previous results
  container.innerHTML = '';

  // Handle "No Results"
  if (data.length === 0) {
    container.innerHTML = `<p class="no-results">No items found. Try again!</p>`;
    return;
  }

  // Build the HTML for each matching item
  data.forEach(item => {
    const card = `
      <div class="result-card">
        <h3>${item.name}</h3>
        <span>${item.category} • ${item.price}</span>
      </div>
    `;
    container.innerHTML += card;
  });
}

// Initial call to show all products on load
renderResults(products);
</script>
<style>
  
  .search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
}

input {
  padding: 12px;
  border: 2px solid #ddd;
  border-radius: 25px;
  flex-grow: 1;
  outline: none;
}

input:focus {
  border-color: #007bff; /* Glow effect when typing */
}

button {
  padding: 10px 20px;
  background: #007bff;
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
  transition: transform 0.1s;
}

/* The "Clickubull" effect */
button:active {
  transform: scale(0.95);
  background: #0056b3;
}

.results-grid {
  display: grid;
  gap: 15px;
}

.result-card {
  padding: 15px;
  border: 1px solid #eee;
  border-radius: 10px;
  background: #fafafa;
}

</style>
<body>
<div>
  <div class="search-box">
  <input type="text" id="searchInput" placeholder="Search products..." oninput="executeSearch()">
  <button id="searchBtn">🔍</button>

<div id="resultsContainer" class="results-grid"></div>
<div id="side">
<div id="cart">
  <h1>cart</h1>
</div>
</div>
</div>
</body>
</html>
