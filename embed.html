<html>
    <head>

    </head>
    <body>
        <button onclick="clickBtn()">Change video</button>
        <iframe id="embed" width="623" height="359" src="https://www.youtube.com/embed/hvL1339luv0" title="Never gonna Meow you up" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
        <script defer>
            const yt_embed = document.getElementById("embed")
            const YT_VIDEOS = ["https://www.youtube.com/embed/hvL1339luv0", "https://www.youtube.com/embed/tvO-LTGIrXo", "https://www.youtube.com/embed/JabG22Zl02I"]

            function clickBtn() {
                yt_embed.src = YT_VIDEOS[Math.floor(Math.random() * YT_VIDEOS.length)]
            }
        </script>
    </body>
</html>
