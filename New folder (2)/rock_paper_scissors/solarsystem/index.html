<html>
    <head>
        <title>SOILER SYSTEM</title>
        <link rel="stylesheet" href="./style.css">
        <script src='./script.js' defer></script>
    </head>
     <body>
        <div class="star-bg">
            <div class="shooting-star"></div>
            <div class="shooting-star"></div>
            <div class="shooting-star"></div>
        </div>
        <h1>the soiler system</h1>
        <div class="solar-system">
            <div class="sun"></div>
            <div class="orbit" id="mercury-orbit">
                <div class="planet" id="mercury" data-planet="mercury">
                </div>  
            </div>  
            <div class="orbit" id="venus-orbit">
                <div class="planet" id="venus" data-planet="venus">
                </div>
            </div>  
            <div class="orbit" id="earth-orbit">
                <div class="planet" id="earth" data-planet="earth">
                    <div class="moon"></div>
                </div>
            </div>
            <div class="orbit" id="mars-orbit">
                <div class="planet" id="mars" data-planet="mars">
                </div>
            </div>
            <div class="orbit" id="jupiter-orbit">        
                <div class="planet" id="jupiter" data-planet="jupiter">
                </div>
            </div>
            <div class="orbit" id="saturn-orbit">        
                <div class="planet" id="saturn" data-planet="saturn">
                </div>
            </div> 
            

        <div id="info-box" class="hidden">
            <h2 id="info-title"></h2>
            <p id="info-fact"></p>
        </div>
     </body>
</html>
