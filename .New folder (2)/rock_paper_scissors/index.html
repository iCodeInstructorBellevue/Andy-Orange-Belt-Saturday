<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>rock_paper_scissors</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Rock, Paper, scissors!</h1>
        </header>

       <div class="Scoreboard">
        <h2>scoredboard</h2>
         <div class="score">
            <p>player: <span id="player-score">0</span></p>
            <p>computer: <span id="computer-score">0</span></p>
         </div>
       </div>

       <div class="match">
        <div class="hand" id="player-hand">
            <img src="images/images.png" alt="player's hand">
            </div>
        <div class="hand" id="computer-hand">
            <img src="images/images.png" alt="computer's hand">
        </div>
       </div>

       <div class="result">
            <p>choose your weapon!</p>
       </div>

        <div class="options">
            <button class="choice-btn" data-choice="rock">rock</button>
            <button class="choice-btn" data-choice="paper">paper</button>
            <button class="choice-btn" data-choice="scissors">scissors</button>
            <button class="choice-btn" data-choice="hand">hand</button>
            <button class="choice-btn" data-choice="gun">gun</button>
            <button class="choice-btn" data-choice="rpg">rpg</button>
            <button class="choice-btn" data-choice="throwing knife">throwing knife</button>
        </div>
    </div>

    <script src="./script.js"></script>
</body>

</html>
