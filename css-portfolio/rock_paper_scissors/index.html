<html>
    <head>
        <title>Rock paper scissors</title>
        <link rel="icon" type="image/x-icon" href="images/um.ico">
        <link rel="stylesheet" href="style.css">
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="game-container">
            <header>
                <h1>Rock, Paper, Scissors ?????</h1>
            </header>

            <div class="scoreboard">
                <h2>Scoreboard</h2>
                <div class="score">
                    <p>Player: <span id="player-score">
                        0
                    </span></p>

                    <p>Computer: <span id="computer-score">
                        0
                    </span></p>
                </div>
            </div>

            <div class="match">
                <div class="hand" id="player-hand">
                    <img src="images/hand.PNG">
                </div>
                <div class="hand" id="computer-hand">
                    <img src="images/hand.PNG">
                </div>
            </div>

            <div class="result">
                <p>Choose ur weapon</p>
            </div>
            
            <div class="options">
                <button class="choice-btn"
                        data-choice="rock">
                    Rock
                </button>
                <button class="choice-btn"
                        data-choice="paper">
                    Paper
                </button>
                <button class="choice-btn"
                        data-choice="scissors">
                    Scissors
                </button>
            </div>
        </div>
    </body>
</html>
