<html>
    <head><style>
        body {
            margin: 0;
            padding: 0;
        }
        #thingy {
            width: 100vh;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes uh {
            0% {
                transform: scale(0%); 
                opacity: 0%;
            }
            100% {
                transform: scale(100%);
                opacity: 100%; 
            }
        }
        #circle {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: green;
            animation: uh 2s ease-out;
            animation-fill-mode: forwards;
        }
    </style></head>
    <body>
        <div id="thingy">
            <div id="circle"></div>
        </div>
    </body>
</html>
